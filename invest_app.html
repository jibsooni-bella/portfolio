<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ETF 투자관리</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg: #f3f4f6;
      --card: #ffffff;
      --line: #e5e7eb;
      --text: #0f172a;
      --sub: #6b7280;
      --blue: #2563eb;
      --green: #16a34a;
      --red: #dc2626;
      --orange: #ea580c;
      --shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      max-width: 1150px;
      margin: 0 auto;
      padding: 20px;
    }

    h1, h2 { margin: 0; }

    .page-title {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 16px;
      color: #0b2a5b;
    }

    .grid-summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 18px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
    }

    .summary-label {
      color: var(--sub);
      font-size: 12px;
      margin-bottom: 8px;
    }

    .summary-value {
      font-size: 18px;
      font-weight: 800;
    }

    .positive { color: var(--green); }
    .negative { color: var(--red); }

    .section {
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 170px 160px 170px 170px 1fr;
      gap: 12px;
      align-items: end;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 12px;
      color: var(--sub);
      font-weight: 700;
    }

    .field input,
    .field select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      font-size: 14px;
      outline: none;
    }

    .field.span-2 {
      grid-column: span 2;
    }

    .row2 {
      margin-top: 12px;
      display: grid;
      grid-template-columns: 170px 170px 170px 1fr;
      gap: 12px;
      align-items: end;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary { background: var(--blue); color: #fff; }
    .btn-green { background: var(--green); color: #fff; }
    .btn-gray { background: #e5e7eb; color: #111827; }
    .btn-red { background: var(--red); color: #fff; }
    .btn-orange { background: var(--orange); color: #fff; }

    .footer-note {
      margin-top: 8px;
      font-size: 12px;
      color: var(--sub);
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .toolbar-right {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .toolbar select,
    .toolbar input {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #fff;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 980px;
    }

    th, td {
      padding: 10px 8px;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
      text-align: left;
      white-space: nowrap;
    }

    th {
      color: var(--sub);
      font-weight: 700;
    }

    td.num, th.num {
      text-align: right;
    }

    .dim {
      color: var(--sub);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .badge.buy {
      background: rgba(22, 163, 74, 0.12);
      color: var(--green);
    }

    .badge.sell {
      background: rgba(220, 38, 38, 0.12);
      color: var(--red);
    }

    .badge.rollback {
      background: rgba(234, 88, 12, 0.12);
      color: var(--orange);
    }

    .muted-row {
      opacity: 0.55;
      background: #fafafa;
    }

    .mobile-only { display: none; }

    canvas {
      width: 100% !important;
      height: 280px !important;
    }

    @media (max-width: 900px) {
      .grid-summary {
        grid-template-columns: repeat(2, 1fr);
      }

      .form-grid,
      .row2 {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 700px) {
      .wrap { padding: 14px; }
      .grid-summary { grid-template-columns: 1fr; }
      .form-grid,
      .row2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 class="page-title">ETF 투자관리</h1>

    <section class="section">
      <div class="grid-summary">
        <div class="card">
          <div class="summary-label">총 매입금</div>
          <div class="summary-value" id="summaryTotalCost">₩0</div>
        </div>
        <div class="card">
          <div class="summary-label">총 평가금액</div>
          <div class="summary-value" id="summaryMarketValue">₩0</div>
        </div>
        <div class="card">
          <div class="summary-label">평가손익</div>
          <div class="summary-value" id="summaryPnL">₩0</div>
        </div>
        <div class="card">
          <div class="summary-label">수익률</div>
          <div class="summary-value" id="summaryReturnRate">0.00%</div>
        </div>
      </div>
    </section>

    <section class="section card">
      <h2 class="section-title">거래기록 추가</h2>

      <div class="form-grid">
        <div class="field">
          <label>거래일</label>
          <input type="date" id="tradeDate" />
        </div>

        <div class="field">
          <label>계좌</label>
          <select id="accountType">
            <option value="ISA">ISA</option>
            <option value="연금저축">연금저축</option>
            <option value="일반">일반</option>
          </select>
        </div>

        <div class="field">
          <label>구분</label>
          <select id="actionType">
            <option value="BUY">매수</option>
            <option value="SELL">매도</option>
          </select>
        </div>

        <div class="field">
          <label>티커</label>
          <input type="text" id="ticker" placeholder="예: 069500.KS" />
        </div>

        <div class="field">
          <label>종목명</label>
          <input type="text" id="name" placeholder="예: KODEX 200" />
        </div>
      </div>

      <div class="row2">
        <div class="field">
          <label>수량</label>
          <input type="number" id="quantity" min="1" step="1" value="0" />
        </div>

        <div class="field">
          <label>단가(원)</label>
          <input type="number" id="unitPrice" min="0" step="1" value="0" />
        </div>

        <div class="field">
          <label>수수료(원)</label>
          <input type="number" id="fee" min="0" step="1" value="0" />
        </div>

        <div class="field">
          <label>메모</label>
          <input type="text" id="memo" placeholder="선택 입력" />
        </div>
      </div>

      <div class="actions">
        <button class="btn-primary" id="saveBtn">저장</button>
        <button class="btn-gray" id="resetBtn" type="button">입력 초기화</button>
        <button class="btn-green" id="refreshBtn" type="button">현재가 새로고침</button>
      </div>

      <div class="footer-note">총매입금/평가금액/손익은 모두 원 단위 정수로 처리됩니다.</div>
    </section>

    <section class="section card">
      <div class="toolbar">
        <h2 class="section-title" style="margin-bottom:0;">보유종목</h2>
        <div class="toolbar-right">
          <select id="holdingAccountFilter">
            <option value="ALL">전체 계좌</option>
            <option value="ISA">ISA</option>
            <option value="연금저축">연금저축</option>
            <option value="일반">일반</option>
          </select>
          <input type="text" id="holdingSearch" placeholder="종목명/티커 검색" />
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>계좌</th>
              <th>종목명</th>
              <th>티커</th>
              <th class="num">보유수량</th>
              <th class="num">평균단가</th>
              <th class="num">총매입금</th>
              <th class="num">현재가</th>
              <th class="num">평가금액</th>
              <th class="num">평가손익</th>
              <th class="num">수익률</th>
            </tr>
          </thead>
          <tbody id="holdingsTableBody"></tbody>
        </table>
      </div>
    </section>

    <section class="section card">
      <h2 class="section-title">자산 차트</h2>
      <canvas id="allocationChart"></canvas>
    </section>

    <section class="section card">
      <div class="toolbar">
        <h2 class="section-title" style="margin-bottom:0;">거래기록</h2>
        <div class="toolbar-right">
          <select id="txnAccountFilter">
            <option value="ALL">전체 계좌</option>
            <option value="ISA">ISA</option>
            <option value="연금저축">연금저축</option>
            <option value="일반">일반</option>
          </select>
          <select id="txnStatusFilter">
            <option value="ALL">전체 상태</option>
            <option value="ACTIVE">정상</option>
            <option value="ROLLED_BACK">롤백</option>
          </select>
          <input type="text" id="txnSearch" placeholder="종목명/티커 검색" />
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>거래일</th>
              <th>계좌</th>
              <th>구분</th>
              <th>종목명</th>
              <th>티커</th>
              <th class="num">수량</th>
              <th class="num">단가</th>
              <th class="num">수수료</th>
              <th class="num">거래금액</th>
              <th>상태</th>
              <th>메모</th>
              <th>관리</th>
            </tr>
          </thead>
          <tbody id="transactionsTableBody"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
    const WORKER_QUOTE_URL = "YOUR_CLOUDFLARE_WORKER_URL";

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let transactions = [];
    let quoteMap = {};
    let allocationChart = null;

    const $ = (id) => document.getElementById(id);

    function todayYmd() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function toInt(value, fallback = 0) {
      if (value === null || value === undefined || value === "") return fallback;
      const n = Number(value);
      if (!Number.isFinite(n)) return fallback;
      return Math.round(n);
    }

    function formatKRW(value) {
      return `₩${toInt(value).toLocaleString("ko-KR")}`;
    }

    function formatNumber(value) {
      return toInt(value).toLocaleString("ko-KR");
    }

    function formatPercent(value) {
      const n = Number(value || 0);
      return `${n.toFixed(2)}%`;
    }

    function escapeHtml(str = "") {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function normalizeTransaction(txn) {
      const normalizedAction = txn.trade_type === "매도" ? "SELL" : "BUY";
      return {
        ...txn,
        account_type: txn.account || "일반",
        action: normalizedAction,
        quantity: toInt(txn.qty),
        unit_price: toInt(txn.price),
        fee: toInt(txn.fee),
        is_rolled_back: txn.is_rolled_back || false
      };
    }

    function txnAmount(txn) {
      return toInt(txn.quantity) * toInt(txn.unit_price) + toInt(txn.fee);
    }

    function deriveHoldingsFromTransactions(sourceTransactions) {
      const activeTxns = [...sourceTransactions]
        .filter(t => !t.is_rolled_back)
        .sort((a, b) => {
          const ad = new Date(`${a.trade_date}T00:00:00`).getTime();
          const bd = new Date(`${b.trade_date}T00:00:00`).getTime();
          if (ad !== bd) return ad - bd;
          return new Date(a.created_at).getTime() - new Date(b.created_at).getTime();
        });

      const map = new Map();

      for (const txn of activeTxns) {
        const account = txn.account_type || "일반";
        const ticker = (txn.ticker || "").trim();
        const name = (txn.name || "").trim();
        const key = `${account}__${ticker}__${name}`;

        if (!map.has(key)) {
          map.set(key, {
            account_type: account,
            ticker,
            name,
            quantity: 0,
            total_cost: 0
          });
        }

        const item = map.get(key);
        const qty = toInt(txn.quantity);
        const unitPrice = toInt(txn.unit_price);
        const fee = toInt(txn.fee);
        const grossAmount = qty * unitPrice;
        const totalAmount = grossAmount + fee;

        if (txn.action === "BUY") {
          item.quantity += qty;
          item.total_cost += totalAmount;
        }

        if (txn.action === "SELL") {
          if (qty <= 0 || item.quantity <= 0) continue;

          const sellQty = Math.min(qty, item.quantity);
          const beforeQty = item.quantity;
          const beforeCost = item.total_cost;

          let costToRemove = 0;
          if (sellQty >= beforeQty) {
            costToRemove = beforeCost;
          } else {
            costToRemove = Math.round((beforeCost * sellQty) / beforeQty);
          }

          item.quantity = beforeQty - sellQty;
          item.total_cost = beforeCost - costToRemove;

          if (item.quantity <= 0) {
            item.quantity = 0;
            item.total_cost = 0;
          }
          if (item.total_cost < 0) item.total_cost = 0;
        }
      }

      return [...map.values()]
        .filter(item => item.quantity > 0)
        .map(item => {
          const currentPrice = toInt(quoteMap[item.ticker]?.price || 0);
          const marketValue = item.quantity * currentPrice;
          const pnl = marketValue - item.total_cost;
          const returnRate = item.total_cost > 0 ? (pnl / item.total_cost) * 100 : 0;
          const avgPrice = item.quantity > 0 ? Math.round(item.total_cost / item.quantity) : 0;

          return {
            ...item,
            current_price: currentPrice,
            market_value: marketValue,
            pnl,
            return_rate: returnRate,
            avg_price: avgPrice
          };
        })
        .sort((a, b) => b.market_value - a.market_value);
    }

    async function loadTransactions() {
      const { data, error } = await supabaseClient
        .from("transactions")
        .select("*")
        .order("trade_date", { ascending: false })
        .order("created_at", { ascending: false });

      if (error) {
        console.error(error);
        alert("거래기록 불러오기에 실패했어요.");
        return;
      }

      transactions = (data || []).map(normalizeTransaction);
    }

    async function insertTransaction(payload) {
      const dbPayload = {
        trade_date: payload.trade_date,
        account: payload.account_type,
        name: payload.name,
        ticker: payload.ticker,
        trade_type: payload.action === "BUY" ? "매수" : "매도",
        qty: toInt(payload.quantity),
        price: toInt(payload.unit_price),
        total_amount: toInt(payload.quantity) * toInt(payload.unit_price) + toInt(payload.fee),
        fee: toInt(payload.fee),
        memo: payload.memo || ""
      };

      const { error } = await supabaseClient
        .from("transactions")
        .insert([dbPayload]);

      if (error) {
        console.error(error);
        alert(`저장 실패: ${error.message}`);
        return false;
      }
      return true;
    }

    async function toggleRollback(id, nextValue) {
      const hasRollbackColumn = transactions.some(t => Object.prototype.hasOwnProperty.call(t, "is_rolled_back"));

      if (!hasRollbackColumn) {
        alert("현재 DB에 is_rolled_back 컬럼이 없어서 롤백 기능을 사용할 수 없어요.");
        return;
      }

      const { error } = await supabaseClient
        .from("transactions")
        .update({ is_rolled_back: nextValue })
        .eq("id", id);

      if (error) {
        console.error(error);
        alert(`롤백 처리 실패: ${error.message}`);
        return;
      }

      await refreshAll(false);
    }

    async function deleteTransaction(id) {
      if (!confirm("이 거래기록을 삭제할까요?")) return;

      const { error } = await supabaseClient
        .from("transactions")
        .delete()
        .eq("id", id);

      if (error) {
        console.error(error);
        alert(`삭제 실패: ${error.message}`);
        return;
      }

      await refreshAll(false);
    }

    async function fetchQuotes() {
      const tickers = [...new Set(
        transactions
          .filter(t => !t.is_rolled_back)
          .map(t => (t.ticker || "").trim())
          .filter(Boolean)
      )];

      if (!tickers.length) {
        quoteMap = {};
        return;
      }

      try {
        const url = `${WORKER_QUOTE_URL}?symbols=${encodeURIComponent(tickers.join(","))}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("quote fetch failed");
        const data = await res.json();
        quoteMap = data || {};
      } catch (err) {
        console.error(err);
        quoteMap = {};
      }
    }

    function getFilteredHoldings() {
      const holdings = deriveHoldingsFromTransactions(transactions);
      const accountFilter = $("holdingAccountFilter").value;
      const keyword = $("holdingSearch").value.trim().toLowerCase();

      return holdings.filter(item => {
        const matchAccount = accountFilter === "ALL" || item.account_type === accountFilter;
        const matchKeyword =
          !keyword ||
          item.name.toLowerCase().includes(keyword) ||
          item.ticker.toLowerCase().includes(keyword);
        return matchAccount && matchKeyword;
      });
    }

    function renderSummary(holdings) {
      const totalCost = holdings.reduce((sum, item) => sum + toInt(item.total_cost), 0);
      const marketValue = holdings.reduce((sum, item) => sum + toInt(item.market_value), 0);
      const pnl = marketValue - totalCost;
      const rate = totalCost > 0 ? (pnl / totalCost) * 100 : 0;

      $("summaryTotalCost").textContent = formatKRW(totalCost);
      $("summaryMarketValue").textContent = formatKRW(marketValue);
      $("summaryPnL").textContent = (pnl >= 0 ? "+" : "") + formatKRW(pnl);
      $("summaryReturnRate").textContent = formatPercent(rate);

      $("summaryPnL").className = "summary-value";
      $("summaryReturnRate").className = "summary-value";

      if (pnl > 0) {
        $("summaryPnL").classList.add("positive");
        $("summaryReturnRate").classList.add("positive");
      } else if (pnl < 0) {
        $("summaryPnL").classList.add("negative");
        $("summaryReturnRate").classList.add("negative");
      }
    }

    function renderHoldings() {
      const holdings = getFilteredHoldings();
      renderSummary(holdings);

      const tbody = $("holdingsTableBody");
      tbody.innerHTML = "";

      if (!holdings.length) {
        tbody.innerHTML = `<tr><td colspan="10" class="dim">보유종목이 없습니다.</td></tr>`;
        renderAllocationChart([]);
        return;
      }

      for (const item of holdings) {
        const pnlStyle = item.pnl > 0 ? "color: #16a34a;" : item.pnl < 0 ? "color: #dc2626;" : "";
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${escapeHtml(item.account_type)}</td>
          <td>${escapeHtml(item.name)}</td>
          <td>${escapeHtml(item.ticker)}</td>
          <td class="num">${formatNumber(item.quantity)}</td>
          <td class="num">${formatKRW(item.avg_price)}</td>
          <td class="num">${formatKRW(item.total_cost)}</td>
          <td class="num">${formatKRW(item.current_price)}</td>
          <td class="num">${formatKRW(item.market_value)}</td>
          <td class="num" style="${pnlStyle}">${item.pnl >= 0 ? "+" : ""}${formatKRW(item.pnl)}</td>
          <td class="num" style="${pnlStyle}">${formatPercent(item.return_rate)}</td>
        `;
        tbody.appendChild(tr);
      }

      renderAllocationChart(holdings);
    }

    function getFilteredTransactions() {
      const accountFilter = $("txnAccountFilter").value;
      const statusFilter = $("txnStatusFilter").value;
      const keyword = $("txnSearch").value.trim().toLowerCase();

      return transactions.filter(txn => {
        const matchAccount = accountFilter === "ALL" || txn.account_type === accountFilter;
        const matchStatus =
          statusFilter === "ALL" ||
          (statusFilter === "ACTIVE" && !txn.is_rolled_back) ||
          (statusFilter === "ROLLED_BACK" && txn.is_rolled_back);

        const matchKeyword =
          !keyword ||
          (txn.name || "").toLowerCase().includes(keyword) ||
          (txn.ticker || "").toLowerCase().includes(keyword);

        return matchAccount && matchStatus && matchKeyword;
      });
    }

    function renderTransactions() {
      const list = getFilteredTransactions();
      const tbody = $("transactionsTableBody");
      tbody.innerHTML = "";

      if (!list.length) {
        tbody.innerHTML = `<tr><td colspan="12" class="dim">거래기록이 없습니다.</td></tr>`;
        return;
      }

      for (const txn of list) {
        const amount = txnAmount(txn);
        const actionBadge = txn.action === "BUY"
          ? `<span class="badge buy">매수</span>`
          : `<span class="badge sell">매도</span>`;

        const statusHtml = txn.is_rolled_back
          ? `<span class="badge rollback">롤백</span>`
          : `<span class="dim">정상</span>`;

        const tr = document.createElement("tr");
        if (txn.is_rolled_back) tr.classList.add("muted-row");

        tr.innerHTML = `
          <td>${escapeHtml(txn.trade_date || "")}</td>
          <td>${escapeHtml(txn.account_type || "")}</td>
          <td>${actionBadge}</td>
          <td>${escapeHtml(txn.name || "")}</td>
          <td>${escapeHtml(txn.ticker || "")}</td>
          <td class="num">${formatNumber(txn.quantity)}</td>
          <td class="num">${formatKRW(txn.unit_price)}</td>
          <td class="num">${formatKRW(txn.fee)}</td>
          <td class="num">${formatKRW(amount)}</td>
          <td>${statusHtml}</td>
          <td>${escapeHtml(txn.memo || "")}</td>
          <td>
            <div style="display:flex; gap:6px; flex-wrap:wrap;">
              <button class="btn-orange" onclick="toggleRollback(${txn.id}, ${!txn.is_rolled_back})">롤백</button>
              <button class="btn-red" onclick="deleteTransaction(${txn.id})">삭제</button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      }
    }

    function renderAllocationChart(holdings) {
      const ctx = $("allocationChart").getContext("2d");

      if (allocationChart) allocationChart.destroy();

      allocationChart = new Chart(ctx, {
        type: "doughnut",
        data: {
          labels: holdings.map(h => h.name),
          datasets: [{
            data: holdings.map(h => h.market_value)
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: "bottom" },
            tooltip: {
              callbacks: {
                label: function(context) {
                  return `${context.label}: ${formatKRW(context.parsed)}`;
                }
              }
            }
          }
        }
      });
    }

    async function handleSave() {
      const payload = {
        trade_date: $("tradeDate").value,
        account_type: $("accountType").value,
        action: $("actionType").value,
        ticker: $("ticker").value.trim(),
        name: $("name").value.trim(),
        quantity: toInt($("quantity").value),
        unit_price: toInt($("unitPrice").value),
        fee: toInt($("fee").value),
        memo: $("memo").value.trim()
      };

      if (!payload.trade_date) return alert("거래일을 입력해줘.");
      if (!payload.ticker) return alert("티커를 입력해줘.");
      if (!payload.name) return alert("종목명을 입력해줘.");
      if (payload.quantity <= 0) return alert("수량을 확인해줘.");

      if (payload.action === "SELL") {
        const currentHoldings = deriveHoldingsFromTransactions(transactions);
        const match = currentHoldings.find(h =>
          h.account_type === payload.account_type &&
          h.ticker === payload.ticker &&
          h.name === payload.name
        );

        const holdQty = match?.quantity || 0;
        if (holdQty < payload.quantity) {
          return alert(`매도 수량이 보유 수량보다 많아요. 현재 보유수량: ${holdQty.toLocaleString("ko-KR")}`);
        }
      }

      const ok = await insertTransaction(payload);
      if (!ok) return;

      resetForm(false);
      await refreshAll(true);
    }

    function resetForm(resetDate = false) {
      if (resetDate) $("tradeDate").value = todayYmd();
      $("accountType").value = "ISA";
      $("actionType").value = "BUY";
      $("ticker").value = "";
      $("name").value = "";
      $("quantity").value = "0";
      $("unitPrice").value = "0";
      $("fee").value = "0";
      $("memo").value = "";
    }

    async function refreshAll(withQuote = true) {
      await loadTransactions();
      if (withQuote) await fetchQuotes();
      renderHoldings();
      renderTransactions();
    }

    function bindEvents() {
      $("saveBtn").addEventListener("click", handleSave);
      $("resetBtn").addEventListener("click", () => resetForm(false));
      $("refreshBtn").addEventListener("click", async () => {
        await fetchQuotes();
        renderHoldings();
      });

      $("holdingAccountFilter").addEventListener("change", renderHoldings);
      $("holdingSearch").addEventListener("input", renderHoldings);
      $("txnAccountFilter").addEventListener("change", renderTransactions);
      $("txnStatusFilter").addEventListener("change", renderTransactions);
      $("txnSearch").addEventListener("input", renderTransactions);
    }

    window.toggleRollback = toggleRollback;
    window.deleteTransaction = deleteTransaction;

    async function init() {
      $("tradeDate").value = todayYmd();
      bindEvents();
      await refreshAll(true);
    }

    init();
  </script>
</body>
</html>
