<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>ETF Investment App</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Arial;
background:#f4f6fa;
padding:40px;
}

.container{
max-width:1200px;
margin:auto;
}

input,select{
padding:7px;
margin:5px;
}

button{
padding:7px 12px;
cursor:pointer;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
background:white;
}

th,td{
border:1px solid #ddd;
padding:7px;
text-align:center;
}

th{
background:#eee;
}

.profit{color:green;}
.loss{color:red;}

</style>

</head>

<body>

<div class="container">

<h1>📊 ETF 투자 관리</h1>

<h3>ETF 추가</h3>

<input id="name" placeholder="종목명">
<input id="ticker" placeholder="티커 (360750.KS)">
<input id="qty" placeholder="수량">
<input id="buy" placeholder="총 매입금">

<button onclick="addStock()">추가</button>
<button onclick="updatePrices()">가격 업데이트</button>

<table id="table">

<thead>
<tr>
<th>자산군</th>
<th>종목</th>
<th>현재가</th>
<th>수량</th>
<th>평균단가</th>
<th>평가금</th>
<th>수익률</th>
<th>삭제</th>
</tr>
</thead>

<tbody></tbody>

</table>

<h3>자산 비중</h3>
<canvas id="pie"></canvas>

<h3>목표 자산배분 (%)</h3>

주식 <input id="tStock">
채권 <input id="tBond">
금 <input id="tGold">
달러 <input id="tDollar">
리츠 <input id="tREIT">

<button onclick="rebalance()">리밸런싱 계산</button>

<div id="rebalanceResult"></div>

<h3>월 투자 기록</h3>

<input id="month" placeholder="2026-03">
<input id="invest" placeholder="투자금">

<button onclick="addInvest()">기록</button>

<canvas id="growth"></canvas>

</div>

<script>

let portfolio=JSON.parse(localStorage.getItem("portfolio"))||[];
let investHistory=JSON.parse(localStorage.getItem("investHistory"))||[];

function save(){
localStorage.setItem("portfolio",JSON.stringify(portfolio));
localStorage.setItem("investHistory",JSON.stringify(investHistory));
}

function classify(name){

name=name.toLowerCase();

if(name.includes("채권")||name.includes("국채")) return "채권";
if(name.includes("금")) return "금";
if(name.includes("달러")) return "달러";
if(name.includes("리츠")) return "리츠";

return "주식";

}

async function getPrice(ticker){

try{

let url=`https://query1.finance.yahoo.com/v7/finance/quote?symbols=${ticker}`;

let res=await fetch(url);
let data=await res.json();

return data.quoteResponse.result[0].regularMarketPrice;

}catch{

return 0;

}

}

async function addStock(){

let name=document.getElementById("name").value;
let ticker=document.getElementById("ticker").value;
let qty=parseFloat(document.getElementById("qty").value);
let buy=parseFloat(document.getElementById("buy").value);

let price=await getPrice(ticker);

portfolio.push({
name,
ticker,
qty,
buy,
price,
type:classify(name)
});

save();
render();

}

function removeStock(i){

portfolio.splice(i,1);
save();
render();

}

async function updatePrices(){

for(let s of portfolio){

s.price=await getPrice(s.ticker);

}

save();
render();

}

function render(){

let tbody=document.querySelector("#table tbody");
tbody.innerHTML="";

portfolio.forEach((s,i)=>{

let avg=s.buy/s.qty;
let value=s.qty*s.price;
let profit=((s.price-avg)/avg)*100;

let row=document.createElement("tr");

row.innerHTML=`

<td>${s.type}</td>
<td>${s.name}</td>
<td>${s.price.toFixed(2)}</td>
<td>${s.qty}</td>
<td>${avg.toFixed(0)}</td>
<td>${value.toFixed(0)}</td>
<td class="${profit>=0?'profit':'loss'}">${profit.toFixed(2)}%</td>
<td><button onclick="removeStock(${i})">삭제</button></td>

`;

tbody.appendChild(row);

});

drawPie();
drawGrowth();

}

let pie;

function drawPie(){

let map={};

portfolio.forEach(s=>{

let value=s.qty*s.price;

if(!map[s.type]) map[s.type]=0;

map[s.type]+=value;

});

let labels=Object.keys(map);
let values=Object.values(map);

let ctx=document.getElementById("pie");

if(pie) pie.destroy();

pie=new Chart(ctx,{
type:"pie",
data:{
labels:labels,
datasets:[{data:values}]
}
});

}

function rebalance(){

let totals={};
let total=0;

portfolio.forEach(s=>{

let value=s.qty*s.price;

if(!totals[s.type]) totals[s.type]=0;

totals[s.type]+=value;

total+=value;

});

let result="<h3>리밸런싱</h3>";

for(let type in totals){

let weight=(totals[type]/total)*100;

result+=`${type} 현재 ${weight.toFixed(1)}%<br>`;

}

document.getElementById("rebalanceResult").innerHTML=result;

}

function addInvest(){

let month=document.getElementById("month").value;
let amount=parseFloat(document.getElementById("invest").value);

investHistory.push({month,amount});

save();
drawGrowth();

}

let growth;

function drawGrowth(){

let labels=[];
let data=[];

investHistory.forEach(i=>{

labels.push(i.month);
data.push(i.amount);

});

let ctx=document.getElementById("growth");

if(growth) growth.destroy();

growth=new Chart(ctx,{
type:"line",
data:{
labels:labels,
datasets:[{
label:"월 투자금",
data:data
}]
}
});

}

updatePrices();
render();

</script>

</body>
</html>
