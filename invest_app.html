<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ETF 투자관리</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg: #f6f8fb;
      --card: #ffffff;
      --line: #e5e7eb;
      --text: #111827;
      --sub: #6b7280;
      --blue: #2563eb;
      --green: #16a34a;
      --red: #dc2626;
      --orange: #ea580c;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    h1, h2, h3 {
      margin: 0 0 12px;
    }

    .page-title {
      margin-bottom: 18px;
      font-size: 28px;
      font-weight: 800;
    }

    .grid-summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 18px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
    }

    .summary-label {
      color: var(--sub);
      font-size: 13px;
      margin-bottom: 8px;
    }

    .summary-value {
      font-size: 24px;
      font-weight: 800;
      line-height: 1.2;
    }

    .summary-value.positive { color: var(--green); }
    .summary-value.negative { color: var(--red); }

    .section {
      margin-bottom: 18px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 13px;
      color: var(--sub);
      font-weight: 600;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 14px;
      outline: none;
    }

    .field textarea {
      resize: vertical;
      min-height: 44px;
    }

    .field.span-2 { grid-column: span 2; }
    .field.span-3 { grid-column: span 3; }
    .field.span-6 { grid-column: span 6; }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary { background: var(--blue); color: white; }
    .btn-gray { background: #e5e7eb; color: #111827; }
    .btn-red { background: var(--red); color: white; }
    .btn-orange { background: var(--orange); color: white; }
    .btn-green { background: var(--green); color: white; }

    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .toolbar .left,
    .toolbar .right {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .toolbar input,
    .toolbar select {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #fff;
    }

    .table-wrap {
      overflow-x: auto;
      border-radius: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1100px;
      background: #fff;
    }

    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      white-space: nowrap;
      font-size: 14px;
    }

    th {
      background: #f9fafb;
      color: var(--sub);
      font-weight: 700;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    td.num, th.num {
      text-align: right;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .badge.buy {
      background: rgba(22, 163, 74, 0.12);
      color: var(--green);
    }

    .badge.sell {
      background: rgba(220, 38, 38, 0.12);
      color: var(--red);
    }

    .badge.rollback {
      background: rgba(234, 88, 12, 0.12);
      color: var(--orange);
    }

    .dim {
      color: var(--sub);
    }

    .muted-row {
      opacity: 0.55;
      background: #fafafa;
    }

    .pc-only { display: block; }
    .mobile-only { display: none; }

    .holding-cards,
    .txn-cards {
      display: grid;
      gap: 12px;
    }

    .holding-card,
    .txn-card {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      background: #fff;
    }

    .holding-top,
    .txn-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .holding-name,
    .txn-name {
      font-weight: 800;
      font-size: 15px;
    }

    .holding-ticker,
    .txn-sub {
      color: var(--sub);
      font-size: 12px;
      margin-top: 2px;
    }

    .kv {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px 12px;
      font-size: 14px;
      margin-top: 10px;
    }

    .kv .k {
      color: var(--sub);
    }

    .kv .v {
      text-align: right;
      font-weight: 700;
    }

    canvas {
      width: 100% !important;
      max-height: 380px;
    }

    .footer-note {
      margin-top: 8px;
      font-size: 12px;
      color: var(--sub);
    }

    @media (max-width: 1024px) {
      .grid-summary {
        grid-template-columns: repeat(2, 1fr);
      }
      .form-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .field.span-2,
      .field.span-3,
      .field.span-6 {
        grid-column: span 2;
      }
    }

    @media (max-width: 768px) {
      .wrap { padding: 14px; }
      .grid-summary { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
      .field.span-2,
      .field.span-3,
      .field.span-6 { grid-column: span 1; }

      .pc-only { display: none; }
      .mobile-only { display: block; }

      .summary-value {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 class="page-title">ETF 투자관리</h1>

    <section class="section">
      <div class="grid-summary">
        <div class="card">
          <div class="summary-label">총 매입금</div>
          <div class="summary-value" id="summaryTotalCost">₩0</div>
        </div>
        <div class="card">
          <div class="summary-label">총 평가금액</div>
          <div class="summary-value" id="summaryMarketValue">₩0</div>
        </div>
        <div class="card">
          <div class="summary-label">평가손익</div>
          <div class="summary-value" id="summaryPnL">₩0</div>
        </div>
        <div class="card">
          <div class="summary-label">수익률</div>
          <div class="summary-value" id="summaryReturnRate">0.00%</div>
        </div>
      </div>
    </section>

    <section class="section card">
      <h2 class="section-title">거래기록 추가</h2>
      <div class="form-grid">
        <div class="field">
          <label>거래일</label>
          <input type="date" id="tradeDate" />
        </div>

        <div class="field">
          <label>계좌</label>
          <select id="accountType">
            <option value="ISA">ISA</option>
            <option value="연금저축">연금저축</option>
            <option value="일반">일반</option>
          </select>
        </div>

        <div class="field">
          <label>구분</label>
          <select id="actionType">
            <option value="BUY">매수</option>
            <option value="SELL">매도</option>
          </select>
        </div>

        <div class="field">
          <label>티커</label>
          <input type="text" id="ticker" placeholder="예: 069500.KS" />
        </div>

        <div class="field span-2">
          <label>종목명</label>
          <input type="text" id="name" placeholder="예: KODEX 200" />
        </div>

        <div class="field">
          <label>수량</label>
          <input type="number" id="quantity" min="1" step="1" placeholder="0" />
        </div>

        <div class="field">
          <label>단가(원)</label>
          <input type="number" id="unitPrice" min="0" step="1" placeholder="0" />
        </div>

        <div class="field">
          <label>수수료(원)</label>
          <input type="number" id="fee" min="0" step="1" value="0" />
        </div>

        <div class="field span-3">
          <label>메모</label>
          <input type="text" id="memo" placeholder="선택 입력" />
        </div>
      </div>

      <div class="actions">
        <button class="btn-primary" id="saveBtn">저장</button>
        <button class="btn-gray" id="resetBtn" type="button">입력 초기화</button>
        <button class="btn-green" id="refreshBtn" type="button">현재가 새로고침</button>
      </div>

      <div class="footer-note">
        총매입금/평가금액/손익은 모두 원 단위 정수로 처리됩니다.
      </div>
    </section>

    <section class="section card">
      <div class="toolbar">
        <div class="left">
          <h2 class="section-title" style="margin:0;">보유종목</h2>
        </div>
        <div class="right">
          <select id="holdingAccountFilter">
            <option value="ALL">전체 계좌</option>
            <option value="ISA">ISA</option>
            <option value="연금저축">연금저축</option>
            <option value="일반">일반</option>
          </select>
          <input type="text" id="holdingSearch" placeholder="종목명/티커 검색" />
        </div>
      </div>

      <div class="pc-only table-wrap">
        <table>
          <thead>
            <tr>
              <th>계좌</th>
              <th>종목명</th>
              <th>티커</th>
              <th class="num">보유수량</th>
              <th class="num">평균단가</th>
              <th class="num">총매입금</th>
              <th class="num">현재가</th>
              <th class="num">평가금액</th>
              <th class="num">평가손익</th>
              <th class="num">수익률</th>
            </tr>
          </thead>
          <tbody id="holdingsTableBody"></tbody>
        </table>
      </div>

      <div class="mobile-only holding-cards" id="holdingsCards"></div>
    </section>

    <section class="section card">
      <h2 class="section-title">자산 차트</h2>
      <canvas id="allocationChart"></canvas>
    </section>

    <section class="section card">
      <div class="toolbar">
        <div class="left">
          <h2 class="section-title" style="margin:0;">거래기록</h2>
        </div>
        <div class="right">
          <select id="txnAccountFilter">
            <option value="ALL">전체 계좌</option>
            <option value="ISA">ISA</option>
            <option value="연금저축">연금저축</option>
            <option value="일반">일반</option>
          </select>
          <select id="txnStatusFilter">
            <option value="ALL">전체 상태</option>
            <option value="ACTIVE">정상</option>
            <option value="ROLLED_BACK">롤백</option>
          </select>
          <input type="text" id="txnSearch" placeholder="종목명/티커 검색" />
        </div>
      </div>

      <div class="pc-only table-wrap">
        <table>
          <thead>
            <tr>
              <th>거래일</th>
              <th>계좌</th>
              <th>구분</th>
              <th>종목명</th>
              <th>티커</th>
              <th class="num">수량</th>
              <th class="num">단가</th>
              <th class="num">수수료</th>
              <th class="num">거래금액</th>
              <th>상태</th>
              <th>메모</th>
              <th>관리</th>
            </tr>
          </thead>
          <tbody id="transactionsTableBody"></tbody>
        </table>
      </div>

      <div class="mobile-only txn-cards" id="txnCards"></div>
    </section>
  </div>

  <script>
    /****************************************************************
     * 환경설정
     ****************************************************************/
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
    const WORKER_QUOTE_URL = "YOUR_CLOUDFLARE_WORKER_URL"; 
    // 예: https://your-worker.workers.dev/quote?symbols=069500.KS,360750.KS

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    /****************************************************************
     * 전역 상태
     ****************************************************************/
    let transactions = [];
    let quoteMap = {};
    let allocationChart = null;

    /****************************************************************
     * 유틸
     ****************************************************************/
    const $ = (id) => document.getElementById(id);

    function todayYmd() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function toInt(value, fallback = 0) {
      if (value === null || value === undefined || value === "") return fallback;
      const n = Number(value);
      if (!Number.isFinite(n)) return fallback;
      return Math.round(n);
    }

    function formatKRW(value) {
      const n = toInt(value, 0);
      return `₩${n.toLocaleString("ko-KR")}`;
    }

    function formatNumber(value) {
      return toInt(value, 0).toLocaleString("ko-KR");
    }

    function formatPercent(value) {
      const n = Number(value || 0);
      return `${n.toFixed(2)}%`;
    }

    function escapeHtml(str = "") {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function txnAmount(txn) {
      return toInt(txn.quantity) * toInt(txn.unit_price) + toInt(txn.fee);
    }

    /****************************************************************
     * 핵심 계산 로직
     * - 거래기록 기반으로 보유종목 재계산
     * - 총매입금은 항상 원 단위 정수
     * - 부분매도는 비율 안분 후 Math.round()
     * - 전량매도는 총매입금 0 보장
     ****************************************************************/
    function deriveHoldingsFromTransactions(sourceTransactions) {
      const activeTxns = [...sourceTransactions]
        .filter(t => !t.is_rolled_back)
        .sort((a, b) => {
          const ad = new Date(`${a.trade_date}T00:00:00`).getTime();
          const bd = new Date(`${b.trade_date}T00:00:00`).getTime();
          if (ad !== bd) return ad - bd;
          return new Date(a.created_at).getTime() - new Date(b.created_at).getTime();
        });

      const map = new Map();

      for (const txn of activeTxns) {
        const account = txn.account_type || "일반";
        const ticker = (txn.ticker || "").trim();
        const name = (txn.name || "").trim();
        const key = `${account}__${ticker}__${name}`;

        if (!map.has(key)) {
          map.set(key, {
            account_type: account,
            ticker,
            name,
            quantity: 0,
            total_cost: 0,
            buy_amount: 0,
            sell_amount: 0,
            realized_pnl: 0
          });
        }

        const item = map.get(key);
        const qty = toInt(txn.quantity);
        const unitPrice = toInt(txn.unit_price);
        const fee = toInt(txn.fee);
        const grossAmount = qty * unitPrice;
        const totalAmount = grossAmount + fee;

        if (txn.action === "BUY") {
          item.quantity += qty;
          item.total_cost += totalAmount;
          item.buy_amount += totalAmount;
        }

        if (txn.action === "SELL") {
          if (qty <= 0) continue;
          if (item.quantity <= 0 || item.total_cost < 0) continue;

          const sellQty = Math.min(qty, item.quantity);
          const beforeQty = item.quantity;
          const beforeCost = item.total_cost;

          let costToRemove = 0;

          if (sellQty >= beforeQty) {
            costToRemove = beforeCost;
          } else {
            // 비율 안분 -> 정수 반올림
            costToRemove = Math.round((beforeCost * sellQty) / beforeQty);
          }

          const sellProceeds = grossAmount - fee; // 매도수수료 차감
          const realized = sellProceeds - costToRemove;

          item.quantity = beforeQty - sellQty;
          item.total_cost = beforeCost - costToRemove;
          item.sell_amount += sellProceeds;
          item.realized_pnl += realized;

          if (item.quantity <= 0) {
            item.quantity = 0;
            item.total_cost = 0;
          }
          if (item.total_cost < 0) {
            item.total_cost = 0;
          }
        }
      }

      const holdings = [...map.values()]
        .filter(item => item.quantity > 0)
        .map(item => {
          const currentPrice = toInt(quoteMap[item.ticker]?.price || 0);
          const marketValue = item.quantity * currentPrice;
          const pnl = marketValue - item.total_cost;
          const returnRate = item.total_cost > 0 ? (pnl / item.total_cost) * 100 : 0;
          const avgPrice = item.quantity > 0 ? Math.round(item.total_cost / item.quantity) : 0;

          return {
            ...item,
            current_price: currentPrice,
            market_value: marketValue,
            pnl,
            return_rate: returnRate,
            avg_price: avgPrice
          };
        });

      return holdings.sort((a, b) => b.market_value - a.market_value);
    }

    /****************************************************************
     * Supabase
     ****************************************************************/
    async function loadTransactions() {
      const { data, error } = await supabaseClient
        .from("transactions")
        .select("*")
        .order("trade_date", { ascending: false })
        .order("created_at", { ascending: false });

      if (error) {
        console.error(error);
        alert("거래기록 불러오기에 실패했어요.");
        return;
      }

      transactions = data || [];
    }

    async function insertTransaction(payload) {
      const { error } = await supabaseClient
        .from("transactions")
        .insert([payload]);

      if (error) {
        console.error(error);
        alert(`저장 실패: ${error.message}`);
        return false;
      }
      return true;
    }

    async function toggleRollback(id, nextValue) {
      const confirmMessage = nextValue
        ? "이 거래를 롤백 처리할까요?"
        : "이 거래의 롤백을 해제할까요?";

      if (!confirm(confirmMessage)) return;

      const { error } = await supabaseClient
        .from("transactions")
        .update({ is_rolled_back: nextValue })
        .eq("id", id);

      if (error) {
        console.error(error);
        alert(`롤백 처리 실패: ${error.message}`);
        return;
      }

      await refreshAll(false);
    }

    async function deleteTransaction(id) {
      if (!confirm("이 거래기록을 삭제할까요? 삭제 후 복구가 어려울 수 있어요.")) return;

      const { error } = await supabaseClient
        .from("transactions")
        .delete()
        .eq("id", id);

      if (error) {
        console.error(error);
        alert(`삭제 실패: ${error.message}`);
        return;
      }

      await refreshAll(false);
    }

    /****************************************************************
     * 현재가 조회
     ****************************************************************/
    async function fetchQuotes() {
      const tickers = [...new Set(
        transactions
          .filter(t => !t.is_rolled_back)
          .map(t => (t.ticker || "").trim())
          .filter(Boolean)
      )];

      if (!tickers.length) {
        quoteMap = {};
        return;
      }

      try {
        const url = `${WORKER_QUOTE_URL}?symbols=${encodeURIComponent(tickers.join(","))}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("quote fetch failed");

        const data = await res.json();

        // 기대 형식 예시:
        // {
        //   "069500.KS": { "price": 41230, "name": "KODEX 200" },
        //   "360750.KS": { "price": 12345, "name": "TIGER 미국S&P500" }
        // }
        quoteMap = data || {};
      } catch (err) {
        console.error(err);
        alert("현재가 조회에 실패했어요. Worker URL을 확인해줘.");
      }
    }

    /****************************************************************
     * 렌더링
     ****************************************************************/
    function getFilteredHoldings() {
      const holdings = deriveHoldingsFromTransactions(transactions);
      const accountFilter = $("holdingAccountFilter").value;
      const keyword = $("holdingSearch").value.trim().toLowerCase();

      return holdings.filter(item => {
        const matchAccount = accountFilter === "ALL" || item.account_type === accountFilter;
        const matchKeyword =
          !keyword ||
          item.name.toLowerCase().includes(keyword) ||
          item.ticker.toLowerCase().includes(keyword);
        return matchAccount && matchKeyword;
      });
    }

    function renderSummary(holdings) {
      const totalCost = holdings.reduce((sum, item) => sum + toInt(item.total_cost), 0);
      const marketValue = holdings.reduce((sum, item) => sum + toInt(item.market_value), 0);
      const pnl = marketValue - totalCost;
      const rate = totalCost > 0 ? (pnl / totalCost) * 100 : 0;

      $("summaryTotalCost").textContent = formatKRW(totalCost);
      $("summaryMarketValue").textContent = formatKRW(marketValue);
      $("summaryPnL").textContent = (pnl >= 0 ? "+" : "") + formatKRW(pnl);
      $("summaryReturnRate").textContent = formatPercent(rate);

      $("summaryPnL").classList.remove("positive", "negative");
      $("summaryReturnRate").classList.remove("positive", "negative");

      if (pnl > 0) {
        $("summaryPnL").classList.add("positive");
        $("summaryReturnRate").classList.add("positive");
      } else if (pnl < 0) {
        $("summaryPnL").classList.add("negative");
        $("summaryReturnRate").classList.add("negative");
      }
    }

    function renderHoldings() {
      const holdings = getFilteredHoldings();
      renderSummary(holdings);

      const tbody = $("holdingsTableBody");
      const cards = $("holdingsCards");

      tbody.innerHTML = "";
      cards.innerHTML = "";

      if (!holdings.length) {
        tbody.innerHTML = `<tr><td colspan="10" class="dim">보유종목이 없습니다.</td></tr>`;
        cards.innerHTML = `<div class="holding-card dim">보유종목이 없습니다.</div>`;
        renderAllocationChart([]);
        return;
      }

      for (const item of holdings) {
        const pnlClass = item.pnl > 0 ? "color: var(--green);" : item.pnl < 0 ? "color: var(--red);" : "";
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${escapeHtml(item.account_type)}</td>
          <td>${escapeHtml(item.name)}</td>
          <td>${escapeHtml(item.ticker)}</td>
          <td class="num">${formatNumber(item.quantity)}</td>
          <td class="num">${formatKRW(item.avg_price)}</td>
          <td class="num">${formatKRW(item.total_cost)}</td>
          <td class="num">${formatKRW(item.current_price)}</td>
          <td class="num">${formatKRW(item.market_value)}</td>
          <td class="num" style="${pnlClass}">${item.pnl >= 0 ? "+" : ""}${formatKRW(item.pnl)}</td>
          <td class="num" style="${pnlClass}">${formatPercent(item.return_rate)}</td>
        `;
        tbody.appendChild(row);

        const card = document.createElement("div");
        card.className = "holding-card";
        card.innerHTML = `
          <div class="holding-top">
            <div>
              <div class="holding-name">${escapeHtml(item.name)}</div>
              <div class="holding-ticker">${escapeHtml(item.ticker)} · ${escapeHtml(item.account_type)}</div>
            </div>
          </div>
          <div class="kv">
            <div class="k">보유수량</div><div class="v">${formatNumber(item.quantity)}</div>
            <div class="k">평균단가</div><div class="v">${formatKRW(item.avg_price)}</div>
            <div class="k">총매입금</div><div class="v">${formatKRW(item.total_cost)}</div>
            <div class="k">현재가</div><div class="v">${formatKRW(item.current_price)}</div>
            <div class="k">평가금액</div><div class="v">${formatKRW(item.market_value)}</div>
            <div class="k">평가손익</div><div class="v" style="${pnlClass}">${item.pnl >= 0 ? "+" : ""}${formatKRW(item.pnl)}</div>
            <div class="k">수익률</div><div class="v" style="${pnlClass}">${formatPercent(item.return_rate)}</div>
          </div>
        `;
        cards.appendChild(card);
      }

      renderAllocationChart(holdings);
    }

    function getFilteredTransactions() {
      const accountFilter = $("txnAccountFilter").value;
      const statusFilter = $("txnStatusFilter").value;
      const keyword = $("txnSearch").value.trim().toLowerCase();

      return transactions.filter(txn => {
        const matchAccount = accountFilter === "ALL" || txn.account_type === accountFilter;
        const matchStatus =
          statusFilter === "ALL" ||
          (statusFilter === "ACTIVE" && !txn.is_rolled_back) ||
          (statusFilter === "ROLLED_BACK" && txn.is_rolled_back);

        const matchKeyword =
          !keyword ||
          (txn.name || "").toLowerCase().includes(keyword) ||
          (txn.ticker || "").toLowerCase().includes(keyword);

        return matchAccount && matchStatus && matchKeyword;
      });
    }

    function renderTransactions() {
      const list = getFilteredTransactions();
      const tbody = $("transactionsTableBody");
      const cards = $("txnCards");

      tbody.innerHTML = "";
      cards.innerHTML = "";

      if (!list.length) {
        tbody.innerHTML = `<tr><td colspan="12" class="dim">거래기록이 없습니다.</td></tr>`;
        cards.innerHTML = `<div class="txn-card dim">거래기록이 없습니다.</div>`;
        return;
      }

      for (const txn of list) {
        const row = document.createElement("tr");
        if (txn.is_rolled_back) row.classList.add("muted-row");

        const amount = txnAmount(txn);
        const badgeClass = txn.action === "BUY" ? "buy" : "sell";
        const statusHtml = txn.is_rolled_back
          ? `<span class="badge rollback">롤백</span>`
          : `<span class="dim">정상</span>`;

        row.innerHTML = `
          <td>${escapeHtml(txn.trade_date)}</td>
          <td>${escapeHtml(txn.account_type)}</td>
          <td><span class="badge ${badgeClass}">${txn.action === "BUY" ? "매수" : "매도"}</span></td>
          <td>${escapeHtml(txn.name || "")}</td>
          <td>${escapeHtml(txn.ticker || "")}</td>
          <td class="num">${formatNumber(txn.quantity)}</td>
          <td class="num">${formatKRW(txn.unit_price)}</td>
          <td class="num">${formatKRW(txn.fee)}</td>
          <td class="num">${formatKRW(amount)}</td>
          <td>${statusHtml}</td>
          <td>${escapeHtml(txn.memo || "")}</td>
          <td>
            <div style="display:flex; gap:6px; flex-wrap:wrap;">
              <button class="btn-orange" onclick="toggleRollback('${txn.id}', ${!txn.is_rolled_back})">
                ${txn.is_rolled_back ? "롤백해제" : "롤백"}
              </button>
              <button class="btn-red" onclick="deleteTransaction('${txn.id}')">삭제</button>
            </div>
          </td>
        `;
        tbody.appendChild(row);

        const card = document.createElement("div");
        card.className = `txn-card ${txn.is_rolled_back ? "muted-row" : ""}`;
        card.innerHTML = `
          <div class="txn-top">
            <div>
              <div class="txn-name">${escapeHtml(txn.name || "-")}</div>
              <div class="txn-sub">${escapeHtml(txn.ticker || "")} · ${escapeHtml(txn.account_type)} · ${escapeHtml(txn.trade_date)}</div>
            </div>
            <div>
              <span class="badge ${badgeClass}">${txn.action === "BUY" ? "매수" : "매도"}</span>
            </div>
          </div>
          <div class="kv">
            <div class="k">수량</div><div class="v">${formatNumber(txn.quantity)}</div>
            <div class="k">단가</div><div class="v">${formatKRW(txn.unit_price)}</div>
            <div class="k">수수료</div><div class="v">${formatKRW(txn.fee)}</div>
            <div class="k">거래금액</div><div class="v">${formatKRW(amount)}</div>
            <div class="k">상태</div><div class="v">${txn.is_rolled_back ? "롤백" : "정상"}</div>
            <div class="k">메모</div><div class="v">${escapeHtml(txn.memo || "-")}</div>
          </div>
          <div class="actions" style="margin-top:12px;">
            <button class="btn-orange" onclick="toggleRollback('${txn.id}', ${!txn.is_rolled_back})">
              ${txn.is_rolled_back ? "롤백해제" : "롤백"}
            </button>
            <button class="btn-red" onclick="deleteTransaction('${txn.id}')">삭제</button>
          </div>
        `;
        cards.appendChild(card);
      }
    }

    function renderAllocationChart(holdings) {
      const ctx = $("allocationChart").getContext("2d");
      const labels = holdings.map(x => x.name);
      const values = holdings.map(x => x.market_value);

      if (allocationChart) {
        allocationChart.destroy();
      }

      allocationChart = new Chart(ctx, {
        type: "doughnut",
        data: {
          labels,
          datasets: [{
            data: values
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: "bottom"
            },
            tooltip: {
              callbacks: {
                label: (context) => {
                  const label = context.label || "";
                  const value = context.parsed || 0;
                  return `${label}: ${formatKRW(value)}`;
                }
              }
            }
          }
        }
      });
    }

    /****************************************************************
     * 저장
     ****************************************************************/
    async function handleSave() {
      const trade_date = $("tradeDate").value;
      const account_type = $("accountType").value;
      const action = $("actionType").value;
      const ticker = $("ticker").value.trim();
      const name = $("name").value.trim();
      const quantity = toInt($("quantity").value);
      const unit_price = toInt($("unitPrice").value);
      const fee = toInt($("fee").value);
      const memo = $("memo").value.trim();

      if (!trade_date) {
        alert("거래일을 입력해줘.");
        return;
      }
      if (!ticker) {
        alert("티커를 입력해줘.");
        return;
      }
      if (!name) {
        alert("종목명을 입력해줘.");
        return;
      }
      if (quantity <= 0) {
        alert("수량은 1 이상이어야 해.");
        return;
      }
      if (unit_price < 0) {
        alert("단가를 확인해줘.");
        return;
      }
      if (fee < 0) {
        alert("수수료를 확인해줘.");
        return;
      }

      if (action === "SELL") {
        const currentHoldings = deriveHoldingsFromTransactions(transactions);
        const match = currentHoldings.find(h =>
          h.account_type === account_type &&
          h.ticker === ticker &&
          h.name === name
        );

        const holdQty = match?.quantity || 0;
        if (holdQty < quantity) {
          alert(`매도 수량이 보유 수량보다 많아요. 현재 보유수량: ${holdQty.toLocaleString("ko-KR")}`);
          return;
        }
      }

      const payload = {
        trade_date,
        account_type,
        action,
        ticker,
        name,
        quantity,
        unit_price,
        fee,
        memo,
        is_rolled_back: false
      };

      const ok = await insertTransaction(payload);
      if (!ok) return;

      resetForm(false);
      await refreshAll(true);
    }

    function resetForm(resetDate = false) {
      if (resetDate) $("tradeDate").value = todayYmd();
      $("accountType").value = "ISA";
      $("actionType").value = "BUY";
      $("ticker").value = "";
      $("name").value = "";
      $("quantity").value = "";
      $("unitPrice").value = "";
      $("fee").value = "0";
      $("memo").value = "";
    }

    /****************************************************************
     * 전체 새로고침
     ****************************************************************/
    async function refreshAll(withQuote = true) {
      await loadTransactions();
      if (withQuote) {
        await fetchQuotes();
      }
      renderHoldings();
      renderTransactions();
    }

    /****************************************************************
     * 이벤트
     ****************************************************************/
    function bindEvents() {
      $("saveBtn").addEventListener("click", handleSave);
      $("resetBtn").addEventListener("click", () => resetForm(false));
      $("refreshBtn").addEventListener("click", async () => {
        await fetchQuotes();
        renderHoldings();
      });

      $("holdingAccountFilter").addEventListener("change", renderHoldings);
      $("holdingSearch").addEventListener("input", renderHoldings);

      $("txnAccountFilter").addEventListener("change", renderTransactions);
      $("txnStatusFilter").addEventListener("change", renderTransactions);
      $("txnSearch").addEventListener("input", renderTransactions);
    }

    /****************************************************************
     * 초기화
     ****************************************************************/
    async function init() {
      $("tradeDate").value = todayYmd();
      bindEvents();
      await refreshAll(true);
    }

    window.toggleRollback = toggleRollback;
    window.deleteTransaction = deleteTransaction;

    init();
  </script>
</body>
</html>
