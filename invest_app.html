<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETF 투자 관리</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
font-family: Arial;
background:#f5f7fb;
margin:0;
padding:20px;
}

h1{font-size:32px}

.card{
background:white;
padding:16px;
border-radius:12px;
margin-bottom:16px;
box-shadow:0 3px 10px rgba(0,0,0,0.05);
}

.grid{
display:grid;
grid-template-columns:repeat(6,1fr);
gap:8px;
}

input,select,button{
padding:8px;
border-radius:6px;
border:1px solid #ddd;
}

button{
background:#2f6fed;
color:white;
border:none;
cursor:pointer;
}

.secondary{
background:#eef3ff;
color:#2f6fed;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th,td{
padding:8px;
border-bottom:1px solid #eee;
text-align:center;
}

.profit{color:#067647}
.loss{color:#b42318}
</style>
</head>

<body>

<h1>ETF 투자 관리</h1>

<div class="card">

<h3>종목 추가</h3>

<div class="grid">

<select id="account">
<option value="ISA">ISA</option>
<option value="연금저축">연금저축</option>
<option value="금현물계좌">금현물계좌</option>
</select>

<input id="name" placeholder="종목명">
<input id="ticker" placeholder="티커">
<input id="qty" type="number" placeholder="수량">
<input id="buy" type="number" placeholder="총 매입금">
<input id="price" type="number" placeholder="현재가">

</div>

<br>

<button onclick="addHolding()">추가</button>
<button class="secondary" onclick="updateAllPrices()">가격 자동 업데이트</button>

</div>

<div class="card">

<h3>요약</h3>

총 매입금 : <span id="sumBuy"></span><br>
총 평가금 : <span id="sumValue"></span><br>
총 손익 : <span id="sumProfit"></span><br>
총 수익률 : <span id="sumRate"></span>

</div>

<div class="card">

<h3>보유 종목</h3>

<table>

<thead>

<tr>
<th>계좌</th>
<th>종목</th>
<th>티커</th>
<th>수량</th>
<th>매입금</th>
<th>평균단가</th>
<th>현재가</th>
<th>평가금</th>
<th>손익</th>
<th>수익률</th>
<th>배당률%</th>
<th>연배당</th>
<th>삭제</th>
</tr>

</thead>

<tbody id="holdingsBody"></tbody>

</table>

</div>

<div class="card">

<h3>자산 비중</h3>

<canvas id="assetChart"></canvas>

</div>

<div class="card">

<h3>월 투자 기록</h3>

<input type="month" id="investMonth">
<input type="number" id="investAmount" placeholder="투자금">

<button onclick="addMonthly()">기록추가</button>

<table>

<thead>

<tr>
<th>월</th>
<th>투자금</th>
<th>삭제</th>
</tr>

</thead>

<tbody id="monthlyBody"></tbody>

</table>

</div>

<div class="card">

<h3>월 투자 그래프</h3>

<canvas id="monthlyChart"></canvas>

</div>

<script>

const supabaseUrl="https://elitonibcpypezuhzwch.supabase.co"
const supabaseKey="sb_publishable_ciS23u-IPzbLgaXQf27TMw___Sofvw3"

const {createClient}=supabase

const db=createClient(supabaseUrl,supabaseKey)

const WORKER_URL="https://etf-price-worker.bellayeon.workers.dev/"

let holdings=[]
let assetChart=null
let monthlyChart=null

let monthly=JSON.parse(localStorage.getItem("monthly")||"[]")

function won(n){return Number(n||0).toLocaleString()+"원"}

function pct(n){return Number(n||0).toFixed(2)+"%"}

function num(v){return Number(v)||0}

async function reload(){

const {data}=await db.from("holdings").select("*").order("id")

holdings=data||[]

render()

}

async function addHolding(){

let account=document.getElementById("account").value
let name=document.getElementById("name").value
let ticker=document.getElementById("ticker").value
let qty=num(document.getElementById("qty").value)
let buy=num(document.getElementById("buy").value)
let price=num(document.getElementById("price").value)

if(!price&&ticker){

let r=await fetch(WORKER_URL+"?ticker="+ticker)
let d=await r.json()
price=d.price||0

}

const item={

account,
name,
ticker,
qty,
buy,
price,
assetType:"주식",
dividendYield:0

}

const {data}=await db.from("holdings").insert([item]).select()

holdings.push(data[0])

render()

}

async function deleteHolding(id){

await db.from("holdings").delete().eq("id",id)

holdings=holdings.filter(h=>h.id!=id)

render()

}

async function updateAllPrices(){

for(let h of holdings){

if(h.ticker){

let r=await fetch(WORKER_URL+"?ticker="+h.ticker)
let d=await r.json()

h.price=d.price

await db.from("holdings").update({price:d.price}).eq("id",h.id)

}

}

render()

}

function render(){

let body=document.getElementById("holdingsBody")

body.innerHTML=""

let totalBuy=0
let totalValue=0
let dividend=0

holdings.forEach(h=>{

let avg=h.qty?h.buy/h.qty:0
let value=h.qty*h.price
let profit=value-h.buy
let rate=h.buy?profit/h.buy*100:0
let div=value*(h.dividendYield||0)/100

totalBuy+=h.buy
totalValue+=value
dividend+=div

body.innerHTML+=`

<tr>

<td>${h.account}</td>
<td>${h.name}</td>
<td>${h.ticker}</td>
<td>${h.qty}</td>
<td>${won(h.buy)}</td>
<td>${Math.round(avg)}</td>
<td>${won(h.price)}</td>
<td>${won(value)}</td>
<td class="${profit>=0?'profit':'loss'}">${won(profit)}</td>
<td>${pct(rate)}</td>

<td>
<input type="number"
value="${h.dividendYield||0}"
onchange="updateDividend(${h.id},this.value)">
</td>

<td>${won(div)}</td>

<td>
<button onclick="deleteHolding(${h.id})">
삭제
</button>
</td>

</tr>

`

})

let totalProfit=totalValue-totalBuy
let totalRate=totalBuy?totalProfit/totalBuy*100:0

document.getElementById("sumBuy").innerText=won(totalBuy)
document.getElementById("sumValue").innerText=won(totalValue)
document.getElementById("sumProfit").innerText=won(totalProfit)
document.getElementById("sumRate").innerText=pct(totalRate)

renderChart()

renderMonthly()

}

async function updateDividend(id,val){

await db.from("holdings").update({dividendYield:val}).eq("id",id)

reload()

}

function renderChart(){

let map={}

holdings.forEach(h=>{

let v=h.qty*h.price

map[h.account]=(map[h.account]||0)+v

})

let labels=Object.keys(map)
let data=Object.values(map)

let ctx=document.getElementById("assetChart")

if(assetChart)assetChart.destroy()

assetChart=new Chart(ctx,{

type:"pie",

data:{
labels,
datasets:[{data}]
}

})

}

function addMonthly(){

let m=document.getElementById("investMonth").value
let a=num(document.getElementById("investAmount").value)

monthly.push({m,a})

localStorage.setItem("monthly",JSON.stringify(monthly))

renderMonthly()

}

function renderMonthly(){

let body=document.getElementById("monthlyBody")

body.innerHTML=""

monthly.forEach((i,n)=>{

body.innerHTML+=`

<tr>
<td>${i.m}</td>
<td>${won(i.a)}</td>
<td><button onclick="delMonthly(${n})">삭제</button></td>
</tr>

`

})

let ctx=document.getElementById("monthlyChart")

let labels=monthly.map(i=>i.m)
let data=monthly.map(i=>i.a)

if(monthlyChart)monthlyChart.destroy()

monthlyChart=new Chart(ctx,{

type:"line",

data:{labels,datasets:[{label:"월 투자금",data}]}

})

}

function delMonthly(i){

monthly.splice(i,1)

localStorage.setItem("monthly",JSON.stringify(monthly))

renderMonthly()

}

reload()

</script>

</body>
</html>
